name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ImageMagick
        run: choco install imagemagick -y --no-progress

      - name: Build MSIX package
        run: cargo x package --platform windows

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellfeather-windows
          path: packaging/output/*.msix

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build DMG package
        run: cargo x package --platform macos

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellfeather-macos
          path: packaging/output/*.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          awk "/^## \[${version}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}' > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wellfeather-windows/*.msix
            artifacts/wellfeather-macos/*.dmg
          draft: false
          generate_release_notes: false
          body_path: release_notes.txt
